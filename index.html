<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Grade 9 – Kadayawan Term 2 Recitation</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  padding:20px;
  font-family:Arial;
  background:#f3f3f3;
  color:#111
}

.container{
  max-width:970px;
  margin:auto
}

.header,.card{
  background:white;
  border-radius:28px;
  padding:30px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
  margin-bottom:25px
}

.header{
  text-align:center;
  padding:42px 25px
}

h1{
  margin:0;
  font-size:42px
}

h2{
  margin:15px 0 0;
  font-size:32px;
  font-weight:400;
  color:#666
}

#reader{
  max-width:650px;
  margin:auto
}

.status{
  padding:22px;
  border-radius:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  margin-bottom:20px
}

.info{
  background:#fff3cd;
  color:#664d03
}

.success{
  background:#d1e7dd;
  color:#0f5132
}

.error{
  background:#f8d7da;
  color:#842029
}

.student{
  display:none
}

.student.show{
  display:block
}

.student-box{
  background:#f8f9fa;
  border-radius:20px;
  padding:25px;
  margin-bottom:20px
}

.label{
  font-size:15px;
  color:#777;
  margin-top:10px
}

.value{
  font-size:26px;
  font-weight:bold;
  margin-top:4px;
  word-break:break-word
}

button{
  width:100%;
  border:0;
  border-radius:18px;
  padding:22px;
  font-size:23px;
  font-weight:bold;
  cursor:pointer;
  background:#198754;
  color:white
}

button:disabled{
  background:#999
}

.reset{
  background:#555;
  margin-top:12px
}

@media(max-width:600px){
  body{
    padding:10px
  }

  h1{
    font-size:30px
  }

  h2{
    font-size:23px
  }

  .card{
    padding:18px
  }

  .value{
    font-size:21px
  }

  button{
    font-size:20px
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📚 Grade 9 – Kadayawan</h1>
    <h2>Term 2 Recitation Points</h2>
  </div>

  <div class="card">

    <div id="status" class="status info">
      📷 Starting camera...
    </div>

    <div id="reader"></div>

  </div>

  <div id="studentCard" class="card student">

    <div class="student-box">

      <div class="label">STUDENT ID</div>
      <div id="studentId" class="value"></div>

      <div class="label">NAME</div>
      <div id="studentName" class="value"></div>

      <div class="label">SECTION</div>
      <div id="section" class="value"></div>

      <div class="label">TERM 2 RECITATION POINTS</div>
      <div id="points" class="value">—</div>

    </div>

    <button id="addButton" onclick="addPoint()">
      ➕ +1 RECITATION POINT
    </button>

    <button class="reset" onclick="resetScanner()">
      🔄 SCAN ANOTHER STUDENT
    </button>

  </div>

</div>

<script>

/* =========================================================
   KADAYAWAN APPS SCRIPT WEB APP
   ========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxr4E8jEl5Dy96xyfhsGd_U_TssymBrsJKYsQeS3mecrNCJbptzsI-SnGoB9ehMCWQN_w/exec";


let scanner = null;

let currentStudent = null;

let scanningLocked = false;


/* =========================================================
   STATUS MESSAGE
   ========================================================= */

function showStatus(message, type){

  const status =
    document.getElementById("status");

  status.textContent = message;

  status.className =
    "status " + type;

}


/* =========================================================
   API REQUEST
   ========================================================= */

function apiRequest(action, studentId, callback){

  const callbackName =
    "apiCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);

  const script =
    document.createElement("script");

  const timeout =
    setTimeout(function(){

      clean();

      callback({
        success:false,
        error:"The server took too long to respond."
      });

    },15000);


  function clean(){

    clearTimeout(timeout);

    delete window[callbackName];

    if(script.parentNode){

      script.parentNode.removeChild(script);

    }

  }


  window[callbackName] =
    function(result){

      clean();

      callback(result);

    };


  script.onerror =
    function(){

      clean();

      callback({
        success:false,
        error:"Could not connect to the Google Sheet server."
      });

    };


  script.src =
    API_URL +
    "?action=" +
    encodeURIComponent(action) +
    "&studentId=" +
    encodeURIComponent(studentId) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  document.body.appendChild(script);

}


/* =========================================================
   EXTRACT STUDENT ID FROM QR CODE
   ========================================================= */

function extractStudentId(qrText){

  let id =
    String(qrText || "").trim();


  /*
     If QR contains a URL such as:

     https://kathlenemetoda-lang.github.io/
     kadayawan-recitation/?id=KADAYAWAN-001

     extract the ID.
  */

  if(
    id.startsWith("http://") ||
    id.startsWith("https://")
  ){

    try{

      const url =
        new URL(id);

      const parameter =
        url.searchParams.get("id");

      if(parameter){

        id =
          parameter.trim();

      }
      else{

        const parts =
          url.pathname
            .split("/")
            .filter(Boolean);

        if(parts.length){

          id =
            parts[parts.length - 1].trim();

        }

      }

    }
    catch(error){

      console.log(error);

    }

  }


  id =
    id
      .replace(/^id=/i,"")
      .trim();


  return id;

}


/* =========================================================
   LOOK UP STUDENT
   ========================================================= */

function lookupStudent(qrText){

  const studentId =
    extractStudentId(qrText);


  if(!studentId){

    showStatus(
      "❌ No student ID was found in the QR code.",
      "error"
    );

    scanningLocked = false;

    return;

  }


  showStatus(
    "🔎 Looking up " + studentId + "...",
    "info"
  );


  apiRequest(
    "lookup",
    studentId,
    function(result){

      if(!result.success){

        showStatus(
          "❌ " + result.error,
          "error"
        );

        scanningLocked = false;

        return;

      }


      currentStudent =
        result;


      document.getElementById(
        "studentId"
      ).textContent =
        result.studentId;


      document.getElementById(
        "studentName"
      ).textContent =
        result.studentName;


      document.getElementById(
        "section"
      ).textContent =
        result.section;


      document.getElementById(
        "points"
      ).textContent =
        "Ready to add";


      document.getElementById(
        "studentCard"
      ).classList.add("show");


      showStatus(
        "✅ Student found!",
        "success"
      );

    }
  );

}


/* =========================================================
   ADD ONE RECITATION POINT
   ========================================================= */

function addPoint(){

  if(!currentStudent){

    return;

  }


  const button =
    document.getElementById(
      "addButton"
    );


  button.disabled = true;

  button.textContent =
    "⏳ Adding point...";


  showStatus(
    "⏳ Saving recitation point...",
    "info"
  );


  apiRequest(
    "addPoint",
    currentStudent.studentId,
    function(result){

      if(!result.success){

        button.disabled = false;

        button.textContent =
          "➕ +1 RECITATION POINT";


        showStatus(
          "❌ " + result.error,
          "error"
        );

        return;

      }


      currentStudent =
        result;


      document.getElementById(
        "points"
      ).textContent =
        result.points;


      button.textContent =
        "✅ POINT ADDED";


      showStatus(
        "✅ 1 recitation point added for " +
        result.studentName +
        "!",
        "success"
      );

    }
  );

}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startScanner(){

  showStatus(
    "📷 Starting camera...",
    "info"
  );


  try{

    if(!window.isSecureContext){

      throw new Error(
        "Camera requires a secure HTTPS connection."
      );

    }


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "This browser does not support camera access."
      );

    }


    scanner =
      new Html5Qrcode("reader");


    await scanner.start(

      {
        facingMode:"environment"
      },

      {
        fps:10,

        qrbox:{
          width:280,
          height:280
        },

        aspectRatio:1
      },

      function(decodedText){

        if(scanningLocked){

          return;

        }


        scanningLocked = true;


        lookupStudent(
          decodedText
        );

      },

      function(errorMessage){

        // Ignore normal scanning errors.

      }

    );


    showStatus(
      "📷 Camera ready — scan the student's QR code.",
      "info"
    );

  }
  catch(error){

    console.error(error);


    showStatus(
      "⚠️ Camera could not start. " +
      (error.message || "") +
      " Please allow camera access and reload the page.",
      "error"
    );

  }

}


/* =========================================================
   RESET SCANNER
   ========================================================= */

function resetScanner(){

  currentStudent = null;

  scanningLocked = false;


  document
    .getElementById("studentCard")
    .classList.remove("show");


  const button =
    document.getElementById(
      "addButton"
    );


  button.disabled = false;

  button.textContent =
    "➕ +1 RECITATION POINT";


  showStatus(
    "📷 Scan another student's QR code.",
    "info"
  );

}


/* =========================================================
   START WHEN PAGE LOADS
   ========================================================= */

window.addEventListener(
  "load",
  function(){

    setTimeout(
      startScanner,
      500
    );

  }
);

</script>

</body>
</html>
